# https://taskfile.dev

version: '3'

vars:
  EXENAME: distributed-rate-limiter.exe
  REDIS_ADDR: 127.0.0.1:6379
  REDIS_USER: default
  REDIS_PASS: redis123
  PERIOD: 60
  REQ_LIMIT: 2
  REDIS: false
  ALGO: fixed_window
  PORT: 12600
  LOG_FORMAT: "dev"

tasks:
  build:
    cmds:
      - go build -o bin/{{.EXENAME}}
    silent: true

  run:
    deps: [build]
    cmds:
      - ./bin/{{.EXENAME}} --redisaddr {{.REDIS_ADDR}} --redisuser {{.REDIS_USER}} --redispassword {{.REDIS_PASS}} --period {{.PERIOD}} --reqlimit {{.REQ_LIMIT}} --start_without_redis {{.REDIS}} --algorithm {{.ALGO}} --port {{.PORT}} --log_format {{.LOG_FORMAT}}

  help:
    deps: [build]
    cmds:
      - ./bin/{{.EXENAME}} help

  test-all:
    cmds:
      - go test -tags=all ./...
  
  test-integration:
    cmds:
      - go test --tags=integration ./...


# UTILITY
  loc:
    cmds:
      - cloc . --exclude-dir=.git,temp
