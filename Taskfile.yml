# https://taskfile.dev

version: '3'

vars:
# vars for compilation; TODO: make injectable
  EXENAME: distributed-rate-limiter.exe
  REDIS_ADDR: 127.0.0.1:6379
  REDIS_USER: default
  REDIS_PASS: redis123
  PERIOD: 60
  REQ_LIMIT: 2
  REDIS: false
  ALGO: fixed_window
  PORT: 12600
  LOG_FORMAT: "dev"

# vars for debugger
  INSTANCE_NAME: distributed-rate-limiter
  FIXED_WINDOW_FILE: fixed_window.lua
  KEY: ratelimit:abc-123:fixed_window

tasks:
  build:
    cmds:
      - go build -o bin/{{.EXENAME}}
    silent: true

  run:
    deps: [build]
    cmds:
      - ./bin/{{.EXENAME}} --redisaddr {{.REDIS_ADDR}} --redisuser {{.REDIS_USER}} --redispassword {{.REDIS_PASS}} --period {{.PERIOD}} --reqlimit {{.REQ_LIMIT}} --start_without_redis {{.REDIS}} --algorithm {{.ALGO}} --port {{.PORT}} --log_format {{.LOG_FORMAT}}

  help:
    deps: [build]
    cmds:
      - ./bin/{{.EXENAME}} help

  test:
    cmds:
      - go test ./...

  test-all:
    cmds:
      - go test -tags=all ./...
  
  test-integration:
    cmds:
      - go test --tags=integration ./...


# UTILITY
  loc:
    desc: Counts LoCs in the project
    cmds:
      - cloc . --exclude-dir=.git,temp

  debug-fixed_window-cmd:
    desc: Test fixed window Lua-script with cmd arguments
    interactive: true
    cmds:
      - docker cp internal/scripts/{{.FIXED_WINDOW_FILE}} {{.INSTANCE_NAME}}:/tmp/{{.FIXED_WINDOW_FILE}}
      - docker exec -it -e REDISCLI_AUTH={{.REDIS_PASS}} {{.INSTANCE_NAME}} redis-cli --ldb --eval /tmp/{{.FIXED_WINDOW_FILE}} {{.KEY}} , {{.ARGS}}

  debug-fixed_window:
    desc: Test fixed window Lua-script with fixed arguments
    interactive: true
    cmds:
      - docker cp internal/scripts/{{.FIXED_WINDOW_FILE}} {{.INSTANCE_NAME}}:/tmp/{{.FIXED_WINDOW_FILE}}
      - docker exec -it -e REDISCLI_AUTH={{.REDIS_PASS}} {{.INSTANCE_NAME}} redis-cli --ldb --eval /tmp/{{.FIXED_WINDOW_FILE}} {{.KEY}} , {{.PERIOD}} {{.REQ_LIMIT}}
